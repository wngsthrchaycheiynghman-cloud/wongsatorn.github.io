<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>เว็บของวงศธร</title>
    
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            /* --- 1. ส่วนของรูปพื้นหลัง (เปลี่ยนชื่อให้ตรงกับไฟล์ของคุณนะ) --- */
            background-image: url('bg.jpg.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* กล่องข้อความเพื่อให้ตัวหนังสืออ่านง่ายขึ้นเวลาทับรูป */
        .glass-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h1 { color: #2c3e50; }
        p { color: #34495e; }

        /* ตกแต่งช่องพิมพ์ชื่อ */
        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #3498db;
            margin-bottom: 15px;
            width: 250px;
            outline: none;
        }
        
        button { 
            padding: 12px 25px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 8px; 
            border: none; 
            background: #3498db; 
            color: white; 
            transition: 0.3s;
        }

        button:hover {
            background-color: #2ecc71;
            transform: scale(1.1);
        }

        #greeting {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="glass-box">
        <h1>ยินดีต้อนรับสู่เว็บไซต์ของวงศธร</h1>
        <p>เขียนบน Galaxy Tab S10 ด้วยภาษา Python และ HTML</p>
        
        <input type="text" id="nameInput" placeholder="พิมพ์ชื่อของคุณที่นี่...">
        <br>
        <button onclick="sayHello()">ตกลง</button>
        
        <p id="greeting"></p>
    </div>

    <script>
        // --- 3. ส่วนของ JavaScript สำหรับถามชื่อ ---
        function sayHello() {
            // ดึงค่าจากช่อง Input
            var name = document.getElementById('nameInput').value;
            
            if (name === "") {
                alert("กรุณาใส่ชื่อก่อนนะครับ");
            } else {
                // แสดงคำทักทาย
                document.getElementById('greeting').innerText = "สวัสดีครับคุณ " + name + "! ยินดีที่ได้รู้จักครับไอ่เต่า ปิดเทอมพี่ก้อยเขาคงมีคนใหม่แล้วล่ะ";
            }
        }
    </script>

</body>
</html>
